<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Portfolio - Software Developer</title>
    <base href="/" />

    <!-- Viewport & PWA Meta -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta
      name="description"
      content="Professional portfolio showcasing modern web development projects and skills"
    />
    <meta
      name="keywords"
      content="portfolio, software developer, web development, Angular, TypeScript, modern design"
    />
    <meta name="author" content="K. Aksenov - Software Developer" />

    <!-- PWA Manifest (Light/Dark je nach Systemeinstellung) -->
    <link rel="manifest" href="manifest-light.webmanifest" media="(prefers-color-scheme: light)" />
    <link rel="manifest" href="manifest-dark.webmanifest" media="(prefers-color-scheme: dark)" />

    <!-- Theme Colors -->
    <meta name="theme-color" content="#00bc8f" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#00bc8f" media="(prefers-color-scheme: dark)" />
    <meta name="msapplication-TileColor" content="#00bc8f" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Portfolio" />

    <!-- Favicon & Icons -->
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="theme-light/icon-32.png" media="(prefers-color-scheme: light)" />
    <link rel="icon" type="image/png" sizes="32x32" href="theme-dark/icon-32.png" media="(prefers-color-scheme: dark)" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />

    <!-- Open Graph Meta -->
    <meta property="og:title" content="Portfolio - Software Developer" />
    <meta
      property="og:description"
      content="Professional portfolio showcasing modern web development projects and skills"
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://portfolio.dev2ksoftware.com" />
    <meta
      property="og:image"
      content="https://portfolio.dev2ksoftware.com/assets/screenshots/desktop-home.png"
    />

    <!-- Twitter Card Meta -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Portfolio - Software Developer" />
    <meta
      name="twitter:description"
      content="Professional portfolio showcasing modern web development projects and skills"
    />
    <meta
      name="twitter:image"
      content="https://portfolio.dev2ksoftware.com/assets/screenshots/desktop-home.png"
    />
  </head>
  <body>
    <app-root></app-root>
    <noscript>Please enable JavaScript to continue using this application.</noscript>
  </body>
</html>
