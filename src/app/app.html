<div class="app-layout">
  <app-header></app-header>

  <main class="main-content" role="main">
    <router-outlet />
  </main>

  <app-footer></app-footer>

  <dev2k-notification
    [show]="swUpdateService.notification().show"
    [message]="swUpdateService.notification().message"
    [type]="swUpdateService.notification().type"
    [actionText]="swUpdateService.notification().actionText"
    [persist]="swUpdateService.notification().persist"
    [duration]="30000"
    (action)="swUpdateService.onAction()"
    (closed)="swUpdateService.dismiss()"
  />
</div>
