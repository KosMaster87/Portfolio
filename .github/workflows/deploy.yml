name: Build, Test & Deploy to Unraid

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: npm ci

      - name: 🧪 Run Tests with Coverage
        run: npm test -- --no-watch --code-coverage --browsers=ChromeHeadless

      - name: 📊 Generate Coverage Badge
        run: |
          COVERAGE=$(grep -oP 'Lines\s*:\s*\K[\d.]+' coverage/portfolio/index.html | head -1 || echo "0")
          echo "Coverage: $COVERAGE%"
          echo "COVERAGE=$COVERAGE" >> $GITHUB_ENV

      - name: 📚 Generate TypeDoc Documentation
        run: npm run docs
        continue-on-error: true

      - name: 🏗️ Build Production
        run: npm run build -- --configuration production

      - name: 📁 Prepare Deployment Structure
        run: |
          mkdir -p deploy
          cp -r dist/portfolio/browser/* deploy/
          cp -r coverage/portfolio deploy/coverage
          cp -r docs/generated/typedoc deploy/jsdoc

      - name: 📤 Deploy to Unraid via rsync
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.UNRAID_DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.UNRAID_HOST }}" >> ~/.ssh/known_hosts
          # api/ is deployed manually (contact.php, PHPMailer & credentials are
          # gitignored and never checked out on this runner) - never touch it here.
          rsync -avz --delete --exclude='api/' \
            deploy/ "root@${{ secrets.UNRAID_HOST }}:/mnt/nvme/appdata/static-sites/www/portfolio/"

      - name: ✅ Deployment Complete
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          echo "🎉 Deployment successful!"
          echo "🌐 App: https://portfolio.dev2ksoftware.com"
          echo "📊 Coverage: https://portfolio.dev2ksoftware.com/coverage/index.html"
          echo "📚 Docs: https://portfolio.dev2ksoftware.com/jsdoc/index.html"

      - name: 💬 Comment on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            // COVERAGE is set in the "Run Tests & Coverage" step via GITHUB_ENV
            const coverage = '${{ env.COVERAGE }}' || 'N/A';
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## ✅ Build & Test Successful\n\n- 🧪 Tests: Passed\n- 📊 Coverage: ${coverage}%\n\nReady to merge!`
            })
