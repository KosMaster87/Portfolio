name: Build, Test & Deploy to Unraid

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging, dev]
  workflow_dispatch:

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Tests with Coverage
        run: npm test -- --no-watch --code-coverage --browsers=ChromeHeadless

      - name: Generate Coverage Badge
        run: |
          COVERAGE=$(grep -oP 'Lines\s*:\s*\K[\d.]+' coverage/portfolio/index.html | head -1 || echo "0")
          echo "Coverage: $COVERAGE%"
          echo "COVERAGE=$COVERAGE" >> $GITHUB_ENV

      - name: Generate TypeDoc Documentation
        run: npm run docs
        continue-on-error: true

      - name: Build Production
        run: npm run build -- --configuration production

      - name: Prepare Deployment Structure
        run: |
          mkdir -p deploy
          cp -r dist/portfolio/browser/* deploy/
          cp -r coverage/portfolio deploy/coverage
          cp -r docs/generated/typedoc deploy/jsdoc

      - name: Install cloudflared
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/staging')
        run: |
          # ubuntu-latest is a GitHub-hosted cloud runner: it has no route to the
          # Tower's private LAN address. The Cloudflare Tunnel's public hostname
          # (gated by a Service Auth policy, not a human login) is the only way
          # in - cloudflared acts as the SSH transport via ProxyCommand.
          curl -sSL -o cloudflared \
            https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
          chmod +x cloudflared
          sudo mv cloudflared /usr/local/bin/cloudflared
          mkdir -p ~/.ssh

      - name: Deploy to Unraid Production via rsync
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          echo "${{ secrets.UNRAID_DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          cat >> ~/.ssh/config <<EOF
          Host deploy-portfolio.dev2ksoftware.com
            StrictHostKeyChecking no
            UserKnownHostsFile /dev/null
            IdentityFile ~/.ssh/id_ed25519
            IdentitiesOnly yes
            ProxyCommand cloudflared access ssh --hostname %h --id ${{ secrets.CF_ACCESS_CLIENT_ID }} --secret ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          EOF
          chmod 600 ~/.ssh/config

          # api/ is deployed manually (contact.php, PHPMailer & credentials are
          # gitignored and never checked out on this runner) - never touch it here.
          rsync -avz --delete --exclude='api/' \
            deploy/ root@deploy-portfolio.dev2ksoftware.com:/mnt/nvme/appdata/static-sites/www/portfolio/

      - name: Deploy to Unraid Staging via rsync
        if: github.ref == 'refs/heads/staging' && github.event_name == 'push'
        run: |
          echo "${{ secrets.UNRAID_DEPLOY_SSH_KEY_STAGING }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          cat >> ~/.ssh/config <<EOF
          Host deploy-portfolio.dev2ksoftware.com
            StrictHostKeyChecking no
            UserKnownHostsFile /dev/null
            IdentityFile ~/.ssh/id_ed25519
            IdentitiesOnly yes
            ProxyCommand cloudflared access ssh --hostname %h --id ${{ secrets.CF_ACCESS_CLIENT_ID }} --secret ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          EOF
          chmod 600 ~/.ssh/config

          # Staging has no PHP-FPM backend - only the static build is deployed.
          rsync -avz --delete --exclude='api/' \
            deploy/ root@deploy-portfolio.dev2ksoftware.com:/mnt/nvme/appdata/static-sites/www/portfolio-staging/

      - name: Deployment Complete
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/staging')
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "Production deployment successful!"
            echo "App: https://portfolio.dev2ksoftware.com"
            echo "Coverage: https://portfolio.dev2ksoftware.com/coverage/index.html"
            echo "Docs: https://portfolio.dev2ksoftware.com/jsdoc/index.html"
          else
            echo "Staging deployment successful!"
            echo "App: https://staging-portfolio.dev2ksoftware.com"
          fi

      - name: Comment on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v9
        with:
          script: |
            // COVERAGE is set in the "Run Tests & Coverage" step via GITHUB_ENV
            const coverage = '${{ env.COVERAGE }}' || 'N/A';
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## Build & Test Successful\n\n- Tests: Passed\n- Coverage: ${coverage}%\n\nReady to merge!`
            })
